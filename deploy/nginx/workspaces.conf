# 反向代理:按域名把请求转发到控制面与容量服务。
#
# 占位符由 deploy/install.sh 从 deploy/local.env 渲染:
#   __DOMAIN__          对外域名
#   __HTTP_PORT__       控制面对外端口(通常 80)
#   __CAPACITY_PORT__   容量/数据卷服务对外端口(通常 3999)
#   __HTTP_ADDR__       控制面监听地址(本机回环)
#   __CAPACITY_BIND__   容量服务监听地址(本机回环,与对外端口错开)
#   __GPU_METRICS_ADDR__ GPU 历史指标服务地址(本机回环)

# WebSocket:带 Upgrade 头时转发 upgrade,否则保持为空,让 upstream keepalive 生效。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream coder_control_plane {
    server __HTTP_ADDR__;
    keepalive 32;
}

upstream coder_capacity {
    server __CAPACITY_BIND__;
    keepalive 16;
}

server {
    listen __HTTP_PORT__ default_server;
    listen [::]:__HTTP_PORT__ default_server;
    server_name __DOMAIN__;

    # 大文件与长连接:关闭请求体缓冲与响应缓冲、不落临时文件、放宽各类超时。
    client_max_body_size 0;
    client_body_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_socket_keepalive on;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;
    tcp_nodelay on;

    location / {
        proxy_pass http://coder_control_plane;
    }

    # GPU 历史指标(与页面同源,避免额外端口);所有人都可以查看。
    location /gpu-api/ {
        proxy_pass http://__GPU_METRICS_ADDR__/;
    }

    # 容量与数据卷服务。必须与页面同源:控制面下发的 CSP 只允许 connect-src 'self',
    # 浏览器直接访问 http://<域名>:3999 会被 CSP 拦下("Failed to fetch")。
    location /capacity-api/ {
        proxy_pass http://__CAPACITY_BIND__/;
    }
}

server {
    listen __CAPACITY_PORT__ default_server;
    listen [::]:__CAPACITY_PORT__ default_server;
    server_name __DOMAIN__;

    client_max_body_size 0;
    client_body_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_socket_keepalive on;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;
    tcp_nodelay on;

    location / {
        proxy_pass http://coder_capacity;
    }
}
